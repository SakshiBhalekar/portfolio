<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Send a Message | Sakshi</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            padding: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #07070a;

            color: #f5f5f5;

            font-family: "Inter", sans-serif;

        }


        .background {

            position: fixed;

            inset: 0;

            z-index: -1;

            overflow: hidden;

        }


        .glow {

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            filter: blur(130px);

            opacity: 0.14;

        }


        .glow-1 {

            top: -180px;

            left: -160px;

            background: #735cff;

        }


        .glow-2 {

            right: -180px;

            bottom: -150px;

            background: #00d9c0;

        }


        .message-card {

            width: 100%;

            max-width: 700px;

            padding: 42px;

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 22px;

            background:

                radial-gradient(
                    circle at 90% 10%,
                    rgba(139,124,255,0.15),
                    transparent 45%
                ),

                #101015;

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.5);

        }


        .small-title {

            color: #8b7cff;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        h1 {

            margin-top: 10px;

            font-size:
                clamp(34px, 5vw, 50px);

            line-height: 1.1;

            letter-spacing: -2px;

        }


        .intro {

            max-width: 570px;

            margin-top: 13px;

            color: #777;

            font-size: 12px;

            line-height: 1.7;

        }


        form {

            display: flex;

            flex-direction: column;

            gap: 17px;

            margin-top: 30px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        label {

            color: #aaa;

            font-size: 10px;

        }


        input,
        textarea {

            width: 100%;

            padding: 14px 15px;

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 10px;

            outline: none;

            background: #0a0a0d;

            color: white;

            font-family: inherit;

            font-size: 12px;

            transition: 0.3s;

        }


        input {

            height: 48px;

        }


        textarea {

            min-height: 155px;

            resize: vertical;

        }


        input:focus,
        textarea:focus {

            border-color:
                rgba(139,124,255,0.7);

            box-shadow:
                0 0 0 3px
                rgba(139,124,255,0.08);

        }


        input::placeholder,
        textarea::placeholder {

            color: #555;

        }


        .actions {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 3px;

        }


        button,
        .cancel {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 45px;

            padding: 12px 21px;

            border-radius: 9px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;

        }


        button {

            border: none;

            background: white;

            color: black;

            transition: 0.3s;

        }


        button:hover {

            transform: translateY(-2px);

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .cancel {

            border:
                1px solid rgba(255,255,255,0.12);

            background: transparent;

            color: #ddd;

            text-decoration: none;

        }


        .cancel:hover {

            background:
                rgba(255,255,255,0.05);

        }


        #formMessage {

            min-height: 18px;

            margin-top: 5px;

            font-size: 11px;

        }


        @media (max-width: 600px) {

            body {

                padding: 15px;

            }


            .message-card {

                padding: 28px 22px;

            }


            .actions {

                flex-direction: column;

                align-items: stretch;

            }


            button,
            .cancel {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="background">

    <div class="glow glow-1"></div>

    <div class="glow glow-2"></div>

</div>


<div class="message-card">


    <p class="small-title">
        SEND A MESSAGE
    </p>


    <h1>
        Tell me about your idea.
    </h1>


    <p class="intro">

        Have a project, collaboration or
        opportunity? Send me a message and
        I'll get back to you.

    </p>


    <form id="contactForm">


        <div class="form-group">

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>

        </div>


        <div class="form-group">

            <label for="email">
                Your Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                required></textarea>

        </div>


        <div class="actions">

            <button type="submit">
                Send Message →
            </button>


            <a
                href="index.html"
                class="cancel">

                Cancel

            </a>

        </div>


        <p id="formMessage"></p>


    </form>


</div>


<script>

const API_URL = "/api";


const form =
    document.getElementById("contactForm");


const formMessage =
    document.getElementById("formMessage");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const message =
            document
                .getElementById("message")
                .value
                .trim();


        const button =
            form.querySelector("button");


        if (!name || !email || !message) {

            formMessage.textContent =
                "Please fill in all fields.";

            formMessage.style.color =
                "#ff7675";

            return;

        }


        button.disabled = true;

        button.textContent =
            "Sending...";

        formMessage.textContent = "";


        try {

            const response =
                await fetch(
                    `${API_URL}/contact`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            message: message

                        })

                    }
                );


            const data =
                await response.json()
                    .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to send message"
                );

            }


            formMessage.textContent =
                "✓ Message sent successfully!";


            formMessage.style.color =
                "#55efc4";


            form.reset();


        } catch (error) {

            console.error(
                "Contact error:",
                error
            );


            formMessage.textContent =
                "Something went wrong. Please try again.";


            formMessage.style.color =
                "#ff7675";

        }


        finally {

            button.disabled = false;

            button.textContent =
                "Send Message →";

        }

    }
);

</script>


</body>

</html>
